services:
  # ROS 2 swarm controller
  swarm_controller:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NUM_DRONES=${NUM_DRONES:-4}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./src:/root/ros2_ws/src:cached
      - ./logs:/root/logs:delegated
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    devices:
      - /dev/dri:/dev/dri
    command: ["/root/scripts/start_swarm_controller.sh"]

  # Drone instances with Serial DDS + UDP MAVLink
  drone:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - SIM_ADDRESS=127.0.0.1
      - MODEL=gazebo-iris
      - SPEEDUP=1
      - NUM_DRONES=${NUM_DRONES:-4}
      - GZ_PARTITION=${GZ_PARTITION:-$(hostname)}
      - GZ_IP=127.0.0.1
      - GZ_VERBOSE=4
      - GZ_DISCOVERY_MULTICAST=1
      - GZ_TRANSPORT_TOPIC_STATISTICS=1
    volumes:
      - ./logs:/root/logs:delegated
      - ./src/swarm_control/parameters:/root/parameters:ro
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
    command: ["/root/scripts/start_drone_container.sh"]

  # ROS 2 tools for debugging
  ros2_tools:
    image: osrf/ros:humble-desktop
    container_name: ros2_tools
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./src:/root/ros2_ws/src:cached
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash
        echo 'ROS 2 Debug Tools Ready:'
        echo '  ros2 topic list | grep ap/'
        echo '  ros2 topic echo /ap/pose/filtered'
        echo '  ros2 topic hz /ap/time'
        echo ''
        echo 'QGroundControl Connections:'
        echo '  Drone 1: UDP 127.0.0.1:14550'
        echo '  Drone 2: UDP 127.0.0.1:14560'
        echo '  Drone 3: UDP 127.0.0.1:14570'
        tail -f /dev/null
      "

volumes:
  logs:
  parameters:
  config: