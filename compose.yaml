x-common-settings: &common-settings
  network_mode: host
  ipc: host
  pid: host
  privileged: true
#  volumes:
#    - /dev/shm:/dev/shm
#    - /dev:/dev
#    - ./config:/config

services:
  swarm_controller:
    <<: *common-settings
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    network_mode: host
    environment:
      - RMW_FASTRTPS_USE_QOS_FROM_XML=1
      - NUM_DRONES=${NUM_DRONES:-2}
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      #RMW Parameters
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
     # - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
     # - FASTDDS_DEFAULT_PROFILES_FILE=/config/fastdds_node.xml
      - RCUTILS_LOGGING_BUFFERED_STREAM=1
      - RCUTILS_LOGGING_USE_STDOUT=1
      - RMW_FASTRTPS_BUFFER_SIZE=16777216  # 16MB
    volumes:
      - ./src:/root/ros2_ws/src
      - ./logs:/root/logs:delegated
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    devices:
      - /dev/dri:/dev/dri
#    stdin_open: true
#    tty: true
#    command: [ "/bin/bash" ]
    command: [ "/root/scripts/start_swarm_controller.sh" ]

  # Drone instances with Serial DDS + UDP MAVLink
  drone_1:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true #needed for mavproxy to run in non-interactive mode
    environment:
      - INSTANCE=0
      - SYSID_THISMAV=1
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2019
      - MICRO_ROS_AGENT_PORT=2019
    volumes:
      - ./instance_0:/sitl/instance_0
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]

  drone_2:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true
    environment:
      - INSTANCE=1
      - SYSID_THISMAV=2
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2020
      - MICRO_ROS_AGENT_PORT=2020
    volumes:
      - ./instance_1:/sitl/instance_1
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]

  micro-ros-agent-drone1:
    <<: *common-settings
    image: microros/micro-ros-agent:humble
    container_name: micro_ros_agent_drone1
    network_mode: host
    restart: unless-stopped
    environment:
      - MICRO_ROS_AGENT_DISCOVERY_TIMEOUT=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    command: udp4 --port 2019 -v4
    depends_on:
      - drone_1

  micro-ros-agent-drone2:
    <<: *common-settings
    image: microros/micro-ros-agent:humble
    container_name: micro_ros_agent_drone2
    network_mode: host
    restart: unless-stopped
    environment:
      - MICRO_ROS_AGENT_DISCOVERY_TIMEOUT=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    command: udp4 --port 2020 -v4
    depends_on:
      - drone_2