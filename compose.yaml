services:
  swarm_controller:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - NUM_DRONES=${NUM_DRONES:-4}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./src:/root/ros2_ws/src:cached
      - ./logs:/root/logs:delegated
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    command: [ "/bin/bash" ]
    #command: ["/root/scripts/start_swarm_controller.sh"]

  # Drone instances with Serial DDS + UDP MAVLink
  drone_1:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true #needed for mavproxy to run in non-interactive mode
    environment:
      - INSTANCE=0
      - SYSID_THISMAV=1
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2019
      - MICRO_ROS_AGENT_PORT=2019
    volumes:
      - ./instance_0:/sitl/instance_0
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
#    stdin_open: true
#
#    command: [ "/bin/bash" ]
    command: ["/root/scripts/start_drone_container.sh"]
    
  drone_2:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot  
    network_mode: host
    tty: true
    environment:
      - INSTANCE=1
      - SYSID_THISMAV=2
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2020
      - MICRO_ROS_AGENT_PORT=2020
    volumes:
      - ./instance_1:/sitl/instance_1
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]

  micro-ros-agent-drone1:
      image: microros/micro-ros-agent:humble
      container_name: micro_ros_agent_drone1
      network_mode: host
      restart: unless-stopped
      command: udp4 --port 2019 -v6
      environment:
        - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
        - ROS_DOMAIN_ID=0
      depends_on:
        - drone_1

  micro-ros-agent-drone2:
    image: microros/micro-ros-agent:humble
    container_name: micro_ros_agent_drone2
    network_mode: host
    restart: unless-stopped
    command: udp4 --port 2020 -v6
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    depends_on:
      - drone_2