# DDS-based compose file
# ArduPilot communicates directly with ROS 2 via DDS

services:

  # Micro XRCE-DDS Agent (build from Dockerfile)
  dds_agent:
    build:
      context: .
      dockerfile: Dockerfile.dds-agent
    container_name: dds_agent
    network_mode: host
    restart: unless-stopped
    command: ["MicroXRCEAgent", "udp4", "-p", "2019", "-v", "6"]

  # ROS 2 swarm controller with direct DDS communication
  swarm_controller:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NUM_DRONES=${NUM_DRONES:-4}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    depends_on:
      - dds_agent
    volumes:
      - ./src:/root/ros2_ws/src:cached
      - ./logs:/root/logs:delegated
      - ./scripts:/root/scripts:ro
      - ./config:/root/config:ro
      # X11 forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
    devices:
      - /dev/dri:/dev/dri
    command: ["/root/scripts/start_swarm_controller.sh"]

  # Dynamic drone instances with DDS communication
  drone:
    build:
      context: .
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - SIM_ADDRESS=127.0.0.1
      - MODEL=gazebo-iris
      - SPEEDUP=1
      - NUM_DRONES=${NUM_DRONES:-4}
      # DDS configuration
      - DDS_AGENT_IP=127.0.0.1
      - DDS_AGENT_PORT=2019
      # Gazebo environment
      - GZ_PARTITION=${GZ_PARTITION:-$(hostname)}
      - GZ_IP=127.0.0.1
      - GZ_VERBOSE=4
      - GZ_DISCOVERY_MULTICAST=1
      - GZ_TRANSPORT_TOPIC_STATISTICS=1
    volumes:
      - ./logs:/root/logs:delegated
      - ./src/swarm_control:/root/ardu_ws/src/swarm_control:cached
      - ./src/custom_gz:/root/ardu_ws/src/custom_gz:cached
      - ./parameters:/root/parameters:ro
      - ./scripts:/root/scripts:ro
      - ./config:/root/config:ro
    command: ["/root/scripts/start_drone_container.sh"]

  # Optional: ROS 2 tools container for debugging
  ros2_tools:
    image: osrf/ros:humble-desktop
    container_name: ros2_tools
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - ./src:/root/ros2_ws/src:cached
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash
        echo 'ROS 2 tools ready. Available commands:'
        echo '  ros2 topic list'
        echo '  ros2 topic echo /ap/pose/filtered'
        echo '  ros2 service list'
        tail -f /dev/null
      "

volumes:
  logs:
  parameters:
  config: