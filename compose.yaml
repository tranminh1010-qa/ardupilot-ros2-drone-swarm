x-common-settings: &common-settings
  ipc: host  #shares the host’s shared memory mechanism with the containers.
  pid: host
  privileged: true
  restart: unless-stopped
#  volumes:
#    - /dev/shm:/dev/shm
#    - /dev:/dev
#    - ./config:/config

services:

  discovery_server:
    <<: *common-settings
    image: osrf/ros:humble-desktop
    container_name: discovery_server
    network_mode: host
    ports:
      - "11888:11888"
    restart: unless-stopped
#    networks:
#      swarm_network:
#        ipv4_address: 172.20.0.10
#    stdin_open: true
#    tty: true
#    command: [ "/bin/bash" ]
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        fastdds discovery -i 0 -l 172.20.0.10 -p 11811
      "
  

  swarm_controller:
    <<: *common-settings
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    # It ensures that signals sent to the Docker container are correctly propagated to the application process running inside
    init: true
    network_mode: host
    environment:
      - NUM_DRONES=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      #- ROS_DISCOVERY_SERVER=172.20.0.10:11888
      - ROS_DOMAIN_ID=0
    volumes:
      - ./src/swarm_control:/ros2_ws/src/swarm_control
      - ./logs:/root/logs:delegated
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
    stdin_open: true
    tty: true
    command: [ "/bin/bash" ]
#    command: [ "/root/scripts/start_swarm_controller.sh" ]
    depends_on:
      - discovery_server

  drone_1:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true #needed for mavproxy to run in non-interactive mode
    environment:
      - INSTANCE=0
      - SYSID_THISMAV=1
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2019
      - MICRO_ROS_AGENT_PORT=2019
 #     - ROS_DISCOVERY_SERVER=172.20.0.10:11888
    volumes:
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]
    depends_on:
      - micro-ros-agent-drone1

  drone_2:
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true
    environment:
      - INSTANCE=1
      - SYSID_THISMAV=2
      - ROS_DOMAIN_ID=0
      - DDS_UDP_PORT=2020
      - MICRO_ROS_AGENT_PORT=2020
   #   - ROS_DISCOVERY_SERVER=172.20.0.10:11888
    volumes:
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]
    depends_on:
      - micro-ros-agent-drone2

  micro-ros-agent-drone1:
    <<: *common-settings
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.dds-agent
    container_name: micro_ros_agent_drone1
    network_mode: host
    restart: unless-stopped
    environment:
      - MICRO_ROS_AGENT_DISCOVERY_TIMEOUT=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    command: ["udp4", "--port", "2019", "-v4"]

  micro-ros-agent-drone2:
      <<: *common-settings
      build:
        context: ./src/dockerfiles
        dockerfile: Dockerfile.dds-agent
      container_name: micro_ros_agent_drone2
      network_mode: host
      restart: unless-stopped
      environment:
        - MICRO_ROS_AGENT_DISCOVERY_TIMEOUT=10
        - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
        - ROS_DOMAIN_ID=0
        - ROS_NAMESPACE=drone2
      command: ["udp4", "--port", "2020", "-v4"]